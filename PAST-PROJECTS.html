        <script>
        function myFunction() {
  document.getElementById("myDropdown").classList.toggle("show");
}
// Close the dropdown menu if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {
        openDropdown.classList.remove('show');
      }
    }
  }
  
}


function blockhide() {
  document.getElementById("blockhide").classList.toggle("hide");
}
// Close the dropdown menu if the user clicks outside of it

function menubuttonrotate() {
var menulogorotate = document.getElementById("menulogorotate");
    
  if (menulogorotate.style.transform === 'rotate(90deg)') {
    menulogorotate.style.transform = 'rotate(0deg)';
  } else {
    menulogorotate.style.transform = 'rotate(90deg)';
  }
  }




  const scrollableBlock = document.getElementById("blockhide");
  const header = document.getElementById("headershrunk");
// 2. Attach the scroll event listener directly to that block
scrollableBlock.addEventListener("scroll", () => {
  const totalScrollableHeight = scrollableBlock.scrollHeight - scrollableBlock.clientHeight;

  const currentScroll = scrollableBlock.scrollTop;

  const scrollPercentage = currentScroll / totalScrollableHeight;
  
  // 3. Measure the scroll position of the block itself (not the window)
  if (scrollPercentage >= 0.005) {
    header.classList.add("showheadershrunk"); 
  } else {
    header.classList.remove("showheadershrunk"); 
  }
});



const headersmall = document.getElementById("headersmall");
// 2. Attach the scroll event listener directly to that block
scrollableBlock.addEventListener("scroll", () => {
  const totalScrollableHeight = scrollableBlock.scrollHeight - scrollableBlock.clientHeight;

  const currentScroll = scrollableBlock.scrollTop;

  const scrollPercentage = currentScroll / totalScrollableHeight;
  
  // 3. Measure the scroll position of the block itself (not the window)
  if (scrollPercentage >= 0.005) {
    headersmall.classList.add("headersmallhide"); 
  } else {
    headersmall.classList.remove("headersmallhide"); 
  }
});


const menu = document.getElementById("menu");
// 2. Attach the scroll event listener directly to that block
scrollableBlock.addEventListener("scroll", () => {
  const totalScrollableHeight = scrollableBlock.scrollHeight - scrollableBlock.clientHeight;

  const currentScroll = scrollableBlock.scrollTop;

  const scrollPercentage = currentScroll / totalScrollableHeight;
  
  // 3. Measure the scroll position of the block itself (not the window)
  if (scrollPercentage >= 0.005) {
    menu.classList.add("menuhide"); 
  } else {
    menu.classList.remove("menuhide"); 
  }
});

</script>
